<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>jQuery Ripples Demo</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #canvas-bg {
            width: 100%;
            height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <div id="canvas-bg"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.ripples/0.5.3/jquery.ripples.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#canvas-bg').ripples({
                resolution: 512,      // 解像度
                dropRadius: 20,       // 波紋の大きさ
                perturbance: 0.04,    // 屈折率
                interactive: true     // マウス操作有効
            });
        });
    </script>
</body>
</html>
