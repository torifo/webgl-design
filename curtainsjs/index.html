<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curtains.js Fluid Ripple</title>
    <link rel="icon" href="data:,">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
        .plane { width: 100vw; height: 100vh; cursor: crosshair; }
        .plane img, .plane canvas { display: none; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="plane">
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80" crossorigin="anonymous" data-sampler="uTexture">
        <canvas id="ripple-canvas" data-sampler="uDisplacement"></canvas>
    </div>

    <script id="vs" type="x-shader/x-vertex">
        precision mediump float;
        attribute vec3 aVertexPosition;
        attribute vec2 aTextureCoord;
        uniform mat4 uMVMatrix;
        uniform mat4 uPMatrix;
        varying vec2 vTextureCoord;
        void main() {
            gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
            vTextureCoord = aTextureCoord;
        }
    </script>

    <script id="fs" type="x-shader/x-fragment">
        precision mediump float;
        varying vec2 vTextureCoord;
        uniform sampler2D uTexture;
        uniform sampler2D uDisplacement;

        void main() {
            vec4 disp = texture2D(uDisplacement, vTextureCoord);
            vec2 distortion = (disp.rg - 0.5) * 2.0;
            vec2 finalUv = vTextureCoord + distortion * 0.04 * disp.a;
            gl_FragColor = texture2D(uTexture, finalUv);
        }
    </script>

    <script type="module">
        import { Curtains, Plane } from 'https://cdn.jsdelivr.net/npm/curtainsjs@8.1.2/src/index.mjs';

        window.addEventListener("load", () => {
            const curtains = new Curtains({ container: "canvas-container", pixelRatio: Math.min(1.5, window.devicePixelRatio) });
            const planeElement = document.querySelector(".plane");

            const params = {
                vertexShaderID: "vs",
                fragmentShaderID: "fs",
            };

            // ★エラーの原因だった部分を修正しました
            const plane = new Plane(curtains, planeElement, params);

            if (plane) {
                const rw = window.innerWidth;
                const rh = window.innerHeight;

                const rippleCanvas = document.getElementById('ripple-canvas');
                rippleCanvas.width = rw;
                rippleCanvas.height = rh;
                const ctx = rippleCanvas.getContext('2d');

                const brushSize = 128;
                const brushCanvas = document.createElement('canvas');
                brushCanvas.width = brushSize;
                brushCanvas.height = brushSize;
                const bCtx = brushCanvas.getContext('2d');
                const imgData = bCtx.createImageData(brushSize, brushSize);
                const radius = brushSize / 2;

                for (let y = 0; y < brushSize; y++) {
                    for (let x = 0; x < brushSize; x++) {
                        const dx = x - radius;
                        const dy = y - radius;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const i = (y * brushSize + x) * 4;
                        if (dist <= radius) {
                            imgData.data[i] = (dx / radius + 1) / 2 * 255;
                            imgData.data[i+1] = (dy / radius + 1) / 2 * 255;
                            imgData.data[i+2] = 128;
                            imgData.data[i+3] = (1 - dist / radius) * 255;
                        }
                    }
                }
                bCtx.putImageData(imgData, 0, 0);

                const ripples = [];

                plane.onRender(() => {
                    ctx.fillStyle = "rgb(128, 128, 128)";
                    ctx.fillRect(0, 0, rw, rh);

                    for (let i = ripples.length - 1; i >= 0; i--) {
                        const r = ripples[i];
                        r.age += 0.03;

                        if (r.age > 1) {
                            ripples.splice(i, 1);
                            continue;
                        }

                        const currentSize = brushSize * (0.2 + r.age * 0.8);
                        ctx.globalAlpha = 1.0 - r.age;
                        ctx.drawImage(brushCanvas, r.x - currentSize / 2, r.y - currentSize / 2, currentSize, currentSize);
                    }
                    ctx.globalAlpha = 1.0;

                    // キャンバスの更新をWebGLのテクスチャに伝える
                    if (plane.textures && plane.textures.length > 1) {
                        plane.textures[1].needUpdate();
                    }
                });

                const addRipple = (e) => {
                    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
                    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
                    if (clientX !== undefined) {
                        ripples.push({ x: clientX, y: clientY, age: 0 });
                    }
                };

                planeElement.addEventListener("mousemove", addRipple);
                planeElement.addEventListener("touchmove", addRipple, { passive: true });
            }
        });
    </script>
</body>
</html>
